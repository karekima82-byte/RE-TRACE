<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b12">
<title>RE:TRACE v0.6</title>
<style>
:root{
  --bg:#05080d;--panel:rgba(5,12,20,.94);--panel2:rgba(9,20,31,.92);
  --line:#2b617d;--cyan:#78d9ff;--cyan2:#c9f3ff;--muted:#7e94a4;
  --red:#ff6977;--gold:#ffd779;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#020408;color:#edf7fc;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit}
#app{width:100%;max-width:480px;min-height:100svh;margin:auto;background:#07101a;position:relative;overflow:hidden}

/* TITLE */
#title{position:fixed;inset:0;z-index:100;background:
radial-gradient(circle at 50% 30%,#18364b 0,#0a1723 30%,#03060a 72%);
display:flex;flex-direction:column;align-items:center;justify-content:center}
#title.hidden{display:none}
.logo{font:56px Georgia,"Times New Roman",serif;letter-spacing:.18em;margin-left:.18em}
.logoSub{margin-top:8px;color:#91a8b8;font-size:10px;letter-spacing:.42em}
.titleLine{width:190px;height:1px;background:#527487;margin:30px 0}
.startBtn{width:230px;padding:13px 10px;border:1px solid #6ed1f4;background:#081622;
border-radius:5px;letter-spacing:.2em;box-shadow:0 0 28px rgba(68,190,240,.13)}
.startBtn:active{transform:scale(.98)}
.titleVer{margin-top:18px;font-size:9px;color:#647887;letter-spacing:.12em}

/* HUD */
#hud{height:68px;padding:8px;display:grid;grid-template-columns:.7fr 1fr 1.45fr .62fr;gap:5px;
background:linear-gradient(#0c1824,#07101a);border-bottom:1px solid #204b63;position:relative;z-index:20}
.hudCell{min-width:0;border:1px solid #28566e;background:rgba(6,18,29,.82);padding:5px 7px;
clip-path:polygon(0 0,94% 0,100% 28%,100% 100%,6% 100%,0 72%)}
.hudCell small{display:block;color:#72cbe8;font-size:8px;letter-spacing:.1em}
.hudCell strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hudCell.life strong{color:var(--red);font-size:16px}

/* STAGE */
#stage{height:48svh;min-height:330px;position:relative;overflow:hidden;
background:linear-gradient(#91c1d6 0 35%,#d2b78f 35% 48%,#55616a 48% 49%,#252e34 49% 100%)}
#stage.officeMode:before{content:"";position:absolute;inset:0;
background:
linear-gradient(90deg,rgba(255,255,255,.15) 0 2%,transparent 2% 16%,rgba(255,255,255,.12) 16% 18%,transparent 18%),
linear-gradient(180deg,transparent 0 43%,rgba(10,20,28,.18) 43% 44%,transparent 44%);
}
.officeWall{position:absolute;left:0;right:0;bottom:0;height:52%;
background:linear-gradient(180deg,rgba(46,57,63,.08),rgba(12,17,22,.94));border-top:2px solid rgba(220,230,235,.25)}
.officeWindow{position:absolute;top:7%;left:7%;width:38%;height:31%;border:4px solid #263945;
background:linear-gradient(#a6d1df,#d6e1d7);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12)}
.officeWindow:after{content:"";position:absolute;left:48%;top:0;bottom:0;border-left:3px solid #2b3e48}
.officeDesk{position:absolute;bottom:13%;left:5%;right:5%;height:12%;background:#1a242a;border:1px solid #43515a;border-radius:3px}
.officeLamp{position:absolute;right:14%;top:12%;width:13%;height:17%;border-left:3px solid #2c3c44}
.officeLamp:after{content:"";position:absolute;top:0;left:-11px;width:34px;height:16px;border-radius:50%;background:#e5c77d;opacity:.55}
.cityMode{display:none}
#stage.city{background:linear-gradient(#b6d9e8 0 38%,#cdb891 38% 46%,#535e66 46% 47%,#242b31 47% 100%)}
#stage.city .officeWall,#stage.city .officeWindow,#stage.city .officeDesk,#stage.city .officeLamp{display:none}
#stage.city .cityMode{display:block;position:absolute;left:0;right:0;bottom:18%;height:29%;
background:linear-gradient(90deg,#314957 0 8%,transparent 8% 12%,#405867 12% 22%,transparent 22% 26%,#2c4655 26% 36%,transparent 36% 41%,#46606d 41% 51%,transparent 51% 55%,#2e4958 55% 66%,transparent 66% 70%,#3e5867 70% 82%,transparent 82% 87%,#2c4654 87%)}
#charArea{position:absolute;left:5%;right:5%;top:2%;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.charMock{height:83%;width:52%;border-radius:50% 50% 0 0;
background:radial-gradient(circle at 50% 23%,#d9b28f 0 9%,transparent 9.5%),
linear-gradient(100deg,transparent 0 19%,#202b35 19% 34%,#d9b28f 34% 66%,#202b35 66% 81%,transparent 81%);
filter:drop-shadow(0 10px 20px rgba(0,0,0,.4));position:relative}
.charMock:before{content:"";position:absolute;left:30%;right:30%;top:22%;height:3px;background:#2d1e1c;border-radius:50%}
.charMock:after{content:"";position:absolute;left:38%;right:38%;top:29%;height:2px;background:#573b34}
.charMock.misaki{background:radial-gradient(circle at 50% 22%,#e7bd9d 0 10%,transparent 10.5%),
linear-gradient(100deg,transparent 0 12%,#5a243c 12% 30%,#e7bd9d 30% 70%,#5a243c 70% 88%,transparent 88%)}
.charMock.secretary{background:radial-gradient(circle at 50% 22%,#e6c3a8 0 10%,transparent 10.5%),
linear-gradient(100deg,transparent 0 17%,#202832 17% 32%,#e6c3a8 32% 68%,#202832 68% 83%,transparent 83%)}
.charLabel{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:10px;color:#c9e9f5;letter-spacing:.18em;
background:rgba(4,12,20,.7);border:1px solid #31586c;padding:4px 10px}
#sfx{position:absolute;z-index:10;left:50%;top:33%;transform:translate(-50%,-50%) scale(.4) rotate(-7deg);
font-family:Impact,"Arial Black",sans-serif;font-size:46px;line-height:.9;color:#fff;
text-shadow:3px 3px 0 #08111a,-3px -3px 0 #08111a,0 0 18px #72ddff;
white-space:nowrap;opacity:0;pointer-events:none}
#sfx.pop{animation:sfxPop .7s ease-out}
@keyframes sfxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
18%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(3deg)}
100%{opacity:0;transform:translate(-50%,-50%) scale(1.02) rotate(-2deg)}}

/* DIALOGUE */
#dialogue{position:absolute;z-index:12;left:9px;right:9px;bottom:8px;padding:10px 12px 7px;
background:linear-gradient(180deg,rgba(3,10,17,.82),rgba(2,7,13,.97));
border:1px solid #3b9bc2;box-shadow:0 0 24px rgba(24,156,211,.14);
clip-path:polygon(0 0,97% 0,100% 12%,100% 100%,3% 100%,0 86%)}
#speaker{display:inline-block;border-left:3px solid var(--cyan);padding-left:7px;color:var(--cyan2);
font-weight:800;font-size:14px;margin-bottom:3px}
#text{min-height:56px;font-family:"Noto Serif JP","Yu Mincho",serif;font-size:15px;line-height:1.7;white-space:pre-line}
#tap{font-size:8px;color:#6d8290;text-align:right;letter-spacing:.1em}
#choices{display:grid;gap:6px;margin-top:6px}
.choice{border:1px solid #3b89ae;background:#091a28;border-radius:4px;text-align:left;padding:9px 10px;font-size:13px}
.choice:active{background:#12394e}

/* NAV */
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px;background:#050b12;border-top:1px solid #17394d}
.navBtn{border:1px solid #28566e;background:#071521;padding:7px 2px;font-size:8px;text-align:center}
.navBtn b{display:block;color:#a9eaff;font-size:16px;line-height:1;margin-bottom:3px}

/* INFO */
#info{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px 8px 9px;background:#050b12}
.infoBox{border:1px solid #20465c;background:#07111b;padding:7px;min-height:75px}
.infoBox h3{margin:0 0 5px;font-size:9px;letter-spacing:.12em;color:#74d9ff}
.infoBox p{margin:0;font-size:10px;line-height:1.55}.locked{color:#788895}

/* PANEL */
#panel{position:fixed;inset:0;z-index:80;background:rgba(0,3,7,.84);display:none;align-items:flex-end}
#panel.open{display:flex}
.sheet{width:100%;max-width:480px;margin:auto;background:#08111a;border:1px solid #2e6683;border-bottom:0;
border-radius:13px 13px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:78svh;overflow:auto}
.sheet h2{font:22px Georgia,serif;letter-spacing:.08em;margin:0 0 14px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #1b3444;padding:9px 0;font-size:13px}
.dim{color:#7d929f}.close{width:100%;margin-top:14px;padding:11px;border:1px solid #37617a;background:#0d1a25;border-radius:5px}
.log{padding:9px;border:1px solid #21485e;margin-bottom:7px;background:#071521;font-size:12px;line-height:1.55}

/* TOAST */
#toast{position:fixed;z-index:120;top:75px;left:50%;transform:translateX(-50%);
padding:8px 12px;background:#081722;border:1px solid #54bde6;border-radius:4px;font-size:11px;
opacity:0;pointer-events:none;transition:.18s}
#toast.show{opacity:1}
@media(max-height:700px){#stage{height:43svh;min-height:300px}#info{display:none}}
</style>
</head>
<body>
<div id="title">
  <div class="logo">RE:TRACE</div>
  <div class="logoSub">もう一度、選びなおす</div>
  <div class="titleLine"></div>
  <button class="startBtn" onclick="startGame()">NEW GAME</button>
  <div class="titleVer">CHAPTER 1　3,000億円の男　/　v0.6</div>
</div>

<div id="app">
  <header id="hud">
    <div class="hudCell"><small>DAY</small><strong id="day">01</strong></div>
    <div class="hudCell"><small>TIME</small><strong id="time">13:18</strong></div>
    <div class="hudCell"><small>PLACE</small><strong id="place">本社オフィス</strong></div>
    <div class="hudCell life"><small>LIFE</small><strong id="life">01</strong></div>
  </header>

  <section id="stage" class="officeMode">
    <div class="officeWall"></div><div class="officeWindow"></div><div class="officeDesk"></div><div class="officeLamp"></div>
    <div class="cityMode"></div>
    <div id="charArea"><div id="char" class="charMock secretary"><div id="charLabel" class="charLabel">SECRETARY / 仮表示</div></div></div>
    <div id="sfx"></div>
    <div id="dialogue">
      <div id="speaker"></div>
      <div id="text"></div>
      <div id="tap">TAP / SPACE　―　文字送り</div>
      <div id="choices"></div>
    </div>
  </section>

  <nav id="nav">
    <button class="navBtn" onclick="panel('status')"><b>♙</b>STATUS</button>
    <button class="navBtn" onclick="panel('life')"><b>◷</b>LIFE LOG</button>
    <button class="navBtn" onclick="panel('next')"><b>◇</b>NEXT EVENT</button>
    <button class="navBtn" onclick="panel('smart')"><b>▣</b>SMART</button>
  </nav>

  <section id="info">
    <div class="infoBox"><h3>STATUS</h3><p>山田 拓海　CEO<br>信用　???　　情報網　???<br><span class="locked">TRUE STATUS　LOCKED</span></p></div>
    <div class="infoBox"><h3>NEXT EVENT</h3><p>14:10　美咲と接触<br>20:30　？？？？<br>23:41　██████</p></div>
  </section>
</div>

<div id="panel"><div class="sheet"><div id="sheetBody"></div><button class="close" onclick="closePanel()">CLOSE</button></div></div>
<div id="toast"></div>

<script>
const scenes=[
 {sp:"秘書",kind:"secretary",place:"東京・本社オフィス",text:"「社長。本日の決裁分です。」",sfx:"ガチャッ！"},
 {sp:"拓海",kind:"taku",text:"「んー。」"},
 {sp:"秘書",kind:"secretary",text:"「全部です。」"},
 {sp:"拓海",kind:"taku",text:"「多くない？」"},
 {sp:"秘書",kind:"secretary",text:"「社長ですので。」"},
 {sp:"拓海",kind:"taku",text:"「社長って大変だな。」"},
 {sp:"秘書",kind:"secretary",text:"「他人事みたいに言わないでください。」"},
 {sp:"拓海",kind:"taku",text:"「ちょっとトイレ。」",choices:[["全部見る",8],["逃げる",10]]},
 {sp:"秘書",kind:"secretary",text:"「嘘ですね。」",sfx:"ピンッ"},
 {sp:"拓海",kind:"taku",text:"「なんで？」"},
 {sp:"秘書",kind:"secretary",text:"「トイレに資料を持っていかないでしょう。」"},
 {sp:"拓海",kind:"taku",text:"「持っていったら仕事熱心に見える？」"},
 {sp:"秘書",kind:"secretary",text:"「余計に怪しいです。」"},
 {sp:"拓海",kind:"taku",text:"「……この投資案件、やめといて。」"},
 {sp:"秘書",kind:"secretary",text:"「理由は？」"},
 {sp:"拓海",kind:"taku",text:"「数字が綺麗すぎる。」"},
 {sp:"秘書",kind:"secretary",text:"「……！」"},
 {sp:"拓海",kind:"taku",text:"「本当に儲かる案件って、もっと汚い数字になるから。」"},
 {sp:"秘書",kind:"secretary",text:"「今のだけは社長らしかったです。」"},
 {sp:"拓海",kind:"taku",text:"「だけ？」"},
 {sp:"秘書",kind:"secretary",text:"「だけです。」"},
 {sp:"拓海",kind:"taku",text:"「……あれ？」",sfx:"ドンッ！"},
 {sp:"拓海",kind:"taku",text:"「この車、前にも買った気がする。」"},
 {sp:"美咲",kind:"misaki",place:"東京・渋谷",text:"「たっくん、また金使ったでしょ。」"},
 {sp:"拓海",kind:"taku",text:"「なんで分かる。」"},
 {sp:"美咲",kind:"misaki",text:"「顔。」"},
 {sp:"拓海",kind:"taku",text:"「どんな顔？」"},
 {sp:"美咲",kind:"misaki",text:"「金使った男の顔。」"},
 {sp:"拓海",kind:"taku",text:"「分かりやすいな俺。」"},
 {sp:"美咲",kind:"misaki",text:"「……でも、今回は上手くいくといいね。」"},
 {sp:"拓海",kind:"taku",text:"「何が？」"},
 {sp:"美咲",kind:"misaki",text:"「……なんでもない。」"},
 {sp:"SYSTEM",kind:"system",place:"UNKNOWN",text:"LOOP ERROR",system:true,sfx:"ERROR"},
 {sp:"拓海",kind:"taku",place:"2036 / 08 / 17 23:41",text:"「……気のせい、か。」"},
 {sp:"SYSTEM",kind:"system",place:"2036 / 08 / 17 23:41",text:"――その日、山田拓海は死亡する。",system:true,sfx:"ドンッ!!"},
 {sp:"SYSTEM",kind:"system",place:"LIFE LOG",text:"第1周　死亡\nLOOP COUNT　01\n\n……ここから、RE:TRACEが始まる。",system:true}
];

let index=0,started=false,typing=false,timer=null,bgm=null,bgmOn=true;
const bgmFiles={
 daily:"03_Daily_Bouncy_Urban_Groove.mp3",
 misaki:"05_Childhood_Summer_Promise.mp3",
 strange:"06_Uncanny_Strange_Familiarity.mp3",
 loop:"10_LOOP_For_the_Last_Time.mp3"
};

function $(id){return document.getElementById(id)}

function startGame(){
 started=true;
 $("title").classList.add("hidden");
 playBgm("daily");
 render();
}

function render(){
 const s=scenes[index];
 $("day").textContent=String(Math.min(99,index+1)).padStart(2,"0");
 $("time").textContent=index>=33?"23:41":"13:18";
 $("place").textContent=s.place||"本社オフィス";
 $("life").textContent="01";
 $("speaker").textContent=s.sp;
 $("choices").innerHTML="";
 const stage=$("stage");
 stage.classList.toggle("city",s.kind==="misaki");
 stage.classList.toggle("officeMode",s.kind!=="misaki");
 const char=$("char");
 char.className="charMock "+s.kind;
 $("charLabel").textContent=s.system?"SYSTEM":s.kind==="misaki"?"美咲 / 仮表示":s.kind==="secretary"?"秘書 / 仮表示":"拓海 / 仮表示";
 char.style.display=s.system?"none":"block";
 if(s.sfx)showSfx(s.sfx);
 if(s.choices){
   s.choices.forEach(c=>{
     const b=document.createElement("button");
     b.className="choice";
     b.textContent="▶ "+c[0];
     b.onclick=e=>{e.stopPropagation();index=c[1];render()};
     $("choices").appendChild(b);
   });
 }
 typeText(s.text);
}

function typeText(str){
 typing=true;
 clearInterval(timer);
 $("text").textContent="";
 let n=0;
 timer=setInterval(()=>{
   n++;
   $("text").textContent=str.slice(0,n);
   typeTick();
   if(n>=str.length){clearInterval(timer);typing=false}
 },26);
}

function typeTick(){
 if(!started)return;
 try{
   const ctx=new (window.AudioContext||window.webkitAudioContext)();
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type="square";osc.frequency.value=620;
   gain.gain.setValueAtTime(.012,ctx.currentTime);
   gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.028);
   osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.032);
 }catch(e){}
}

function showSfx(t){
 const el=$("sfx");
 el.textContent=t;
 el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");
}

function next(){
 if(!started)return;
 if(typing){
   clearInterval(timer);typing=false;
   $("text").textContent=scenes[index].text;
   return;
 }
 if(scenes[index].choices)return;
 if(index<scenes.length-1){
   index++;
   if(scenes[index].kind==="misaki")playBgm("misaki");
   if(scenes[index].system)playBgm("loop");
   render();
 }else toast("CHAPTER 1 END");
}

function playBgm(kind){
 if(!bgm)bgm=new Audio();
 bgm.pause();
 bgm.src="assets/audio/"+bgmFiles[kind];
 bgm.loop=true;bgm.volume=.30;
 if(bgmOn)bgm.play().catch(()=>{});
}

function panel(type){
 let h="";
 if(type==="status")h=`<h2>STATUS</h2>
 <div class="row"><span>山田 拓海</span><span class="dim">CEO</span></div>
 <div class="row"><span>所持金</span><span>¥2,840</span></div>
 <div class="row"><span>信用</span><span>？？？</span></div>
 <div class="row"><span>人脈</span><span>？？？</span></div>
 <div class="row"><span>情報網</span><span>？？？</span></div>
 <div class="row"><span>TRUE STATUS</span><span class="dim">LOCKED</span></div>`;
 if(type==="life")h=`<h2>LIFE LOG</h2>
 <div class="log"><b>LIFE 01</b><br>2036/08/17 23:41<br>死亡 / 原因：記録なし</div>
 <div class="log"><b>LIFE 02</b><br>ACTIVE<br>現在の周回を追跡中</div>`;
 if(type==="next")h=`<h2>NEXT EVENT</h2>
 <div class="row"><span>14:10</span><span>美咲と接触</span></div>
 <div class="row"><span>20:30</span><span>？？？？</span></div>
 <div class="row"><span>23:41</span><span>██████</span></div>`;
 if(type==="smart")h=`<h2>SMART</h2>
 <div class="row"><span>連絡先</span><span>3件</span></div>
 <div class="row"><span>メッセージ</span><span>1件</span></div>
 <div class="row"><span>情報検索</span><span>READY</span></div>
 <div class="row"><span>履歴</span><span>LOCKED</span></div>`;
 $("sheetBody").innerHTML=h;
 $("panel").classList.add("open");
}

function closePanel(){$("panel").classList.remove("open")}
function toast(t){
 $("toast").textContent=t;$("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),1200);
}

document.body.addEventListener("click",e=>{
 if(e.target.closest("button")||e.target.closest("#panel"))return;
 next();
});
document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="Enter"){e.preventDefault();next()}
});
render();
</script>
</body>
</html>

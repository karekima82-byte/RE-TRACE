<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RE:TRACE v0.8 Character Switch Demo</title><style>
:root{--cyan:#42d9ff;--blue:#06152a;--line:#168cc7;--pink:#ff536f}*{box-sizing:border-box}html,body{margin:0;background:#020711;color:#eef8ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100%;overflow:hidden}.game{position:relative;width:100vw;height:100svh;max-width:600px;margin:auto;overflow:hidden;background:#020711}.bg{position:absolute;inset:0;background:url('assets/background/office.png') center/cover no-repeat;filter:saturate(.9) brightness(.78)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,7,18,.2),rgba(0,7,18,.05) 45%,rgba(0,6,18,.75))}.hud{position:absolute;z-index:10;top:8px;left:6px;right:6px;height:58px;display:grid;grid-template-columns:1.15fr .75fr .9fr 1.05fr .65fr;gap:3px}.cell{border:1px solid #167db5;background:rgba(3,18,39,.85);box-shadow:0 0 10px #0879bd66 inset,0 0 7px #0879bd44;display:flex;flex-direction:column;justify-content:center;padding:3px 8px;clip-path:polygon(0 0,96% 0,100% 22%,100% 100%,4% 100%,0 78%)}.brand{font-weight:800;letter-spacing:2px;font-size:16px;color:#e9fbff}.label{font-size:9px;color:#8ddcff;letter-spacing:1px}.value{font-size:15px;font-weight:700}.life .value{color:#ff6680;font-size:20px}.menu,.notice{position:absolute;z-index:12;top:78px;border:1px solid #188bc8;background:#06182fdd;box-shadow:0 0 12px #0088dd55;color:#fff}.menu{left:18px;width:76px;padding:9px;text-align:center}.menu b{font-size:23px;display:block;line-height:18px}.notice{right:14px;padding:12px 14px;font-size:13px}.chars{position:absolute;z-index:4;left:0;right:0;top:76px;bottom:265px}.char{position:absolute;transition:all .38s cubic-bezier(.2,.8,.2,1);transform-origin:50% 90%;animation:breathe 3.6s ease-in-out infinite}.char.speaker{z-index:3;width:78%;height:100%;left:11%;bottom:-3%;display:flex;align-items:flex-end;justify-content:center}.char.support{z-index:2;width:36%;height:42%;right:2%;bottom:0;opacity:.82;filter:brightness(.75) saturate(.9)}.char img{max-width:100%;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}.char.speaker img{height:100%;width:auto}.char.support img{height:100%;width:auto}.char.speaking{animation:breatheTalk 1.6s ease-in-out infinite}.name{position:absolute;z-index:8;left:24px;bottom:244px;padding:9px 24px 8px;border:1px solid var(--cyan);background:linear-gradient(90deg,#071c35f5,#06213de8);font-size:18px;font-weight:800;clip-path:polygon(0 0,94% 0,100% 100%,0 100%)}.dialog{position:absolute;z-index:7;left:18px;right:18px;bottom:135px;min-height:112px;padding:31px 22px 18px;border:1.5px solid var(--cyan);background:rgba(3,16,35,.93);box-shadow:0 0 16px #00aaff55 inset,0 0 10px #00aaff44;clip-path:polygon(0 10px,3% 0,100% 0,100% 100%,0 100%)}.text{font-size:18px;line-height:1.65;white-space:pre-wrap}.next{position:absolute;right:18px;bottom:145px;color:#61dcff;font-size:20px}.choices{position:absolute;z-index:8;left:18px;right:18px;bottom:17px;display:grid;gap:7px}.choice{border:1px solid #199de0;background:rgba(4,23,46,.95);color:white;text-align:left;padding:11px 14px;font-size:15px;border-radius:3px;box-shadow:0 0 8px #008cff33}.choice:active{transform:scale(.985);background:#0a3156}.statusbar{position:absolute;z-index:9;bottom:0;left:0;right:0;height:13px;background:#02101fdd;border-top:1px solid #0d6d9c}.tag{position:absolute;z-index:15;left:10px;top:130px;padding:5px 8px;border:1px solid #ff5370;background:#220b16dd;color:#ff8195;font-size:10px}.swap{position:absolute;z-index:16;right:10px;top:130px;padding:5px 8px;border:1px solid #4ce1ff;background:#061c2bdd;color:#9deaff;font-size:10px}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.004)}@keyframes breatheTalk{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.012)}}@media(min-width:601px){.game{border-left:1px solid #17334b;border-right:1px solid #17334b}}
</style></head><body><main class="game"><div class="bg"></div><header class="hud"><div class="cell"><span class="brand">RE:TRACE</span></div><div class="cell"><span class="label">DAY</span><span class="value">01</span></div><div class="cell"><span class="label">TIME</span><span class="value" id="time">18:42</span></div><div class="cell"><span class="label">PLACE</span><span class="value">東京・渋谷</span></div><div class="cell life"><span class="label">LIFE</span><span class="value">01</span></div></header><div class="menu">☰<br><small>MENU</small></div><div class="notice">▣ 新着メッセージ 1件</div><div class="tag">LIVE CHARACTER</div><button class="swap" id="swap">会話を切替</button><section class="chars"><div id="mainChar" class="char speaker speaking"><img id="mainImg" src="assets/secretary/secretary_02_smile.png"></div><div id="subChar" class="char support"><img id="subImg" src="assets/takumi/takumi_01_normal.png"></div></section><div class="name" id="name">秘書</div><div class="dialog"><div class="text" id="text">「社長、おはようございます。<br>本日の会議資料は、すべて準備できています。」</div><div class="next">▼</div></div><div class="choices"><button class="choice" data-who="secretary">秘書に話しかける　›</button><button class="choice" data-who="takumi">拓海CEOに話しかける　›</button><button class="choice" data-who="secretary2">会議の準備を確認する　›</button></div><div class="statusbar"></div></main><script>
const data={secretary:{name:'秘書',main:'assets/secretary/secretary_02_smile.png',sub:'assets/takumi/takumi_01_normal.png',text:'「社長、おはようございます。\n本日の会議資料は、すべて準備できています。」'},takumi:{name:'山田 拓海',main:'assets/takumi/takumi_08_serious.png',sub:'assets/secretary/secretary_01_normal.png',text:'「……おはよう。\n会議は10時。準備はできているか？」'},secretary2:{name:'秘書',main:'assets/secretary/secretary_10_business.png',sub:'assets/takumi/takumi_08_serious.png',text:'「はい。10時から役員会議です。\n追加資料もデスクに置いてあります。」'}};
function show(key){const d=data[key];document.getElementById('name').textContent=d.name;document.getElementById('text').textContent=d.text;document.getElementById('mainImg').src=d.main;document.getElementById('subImg').src=d.sub;document.getElementById('mainChar').classList.add('speaking');document.querySelectorAll('.choice').forEach(b=>b.style.outline='');}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>show(b.dataset.who)));document.getElementById('swap').addEventListener('click',()=>show(document.getElementById('name').textContent==='秘書'?'takumi':'secretary'));
</script></body></html>
